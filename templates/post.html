<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — Guney Can Gokoglu (@gcg)</title>
  <meta name="description" content="{{excerpt}}">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="../../assets/favicons/favicon.svg">
  <link rel="icon" type="image/x-icon" href="../../assets/favicons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicons/apple-icon-180x180.png">

  <!-- Apply a saved day/night choice before first paint -->
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('theme-preference');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

  <link rel="stylesheet" href="../../assets/css/fonts.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/style.css">

  <script src="../../assets/js/theme-toggle.js" defer></script>
  <script src="../../assets/js/petals.js" defer></script>
</head>
<body>

  <div class="backdrop" aria-hidden="true">
    <img class="art art--day" src="../../assets/img/art/backdrop-day.webp" alt="" loading="lazy" decoding="async">
    <img class="art art--night" src="../../assets/img/art/backdrop-night.webp" alt="" loading="lazy" decoding="async">
  </div>
  <div id="petals-back" class="petals" aria-hidden="true"></div>

  <aside class="side-rail" aria-hidden="true" lang="zh">藏经阁 · 无名阵师</aside>

  <button id="theme-toggle-btn" class="theme-toggle" type="button" aria-label="Switch between day and night">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <main class="strip">

    <header class="scene scene--strip">
      <img class="art art--day" src="../../assets/img/art/cover-day.webp" alt="" decoding="async">
      <img class="art art--night" src="../../assets/img/art/cover-night.webp" alt="" loading="lazy" decoding="async">
      <a class="narr narr--home" href="../../">← gcg.me</a>
      <p class="brush strip-brush" lang="zh" aria-hidden="true">藏经阁</p>
    </header>

    <article class="panel scroll-page">
      <header class="scroll-page-head">
        <p class="label">{{formatted_date}} · {{reading_time}}</p>
        <h1>{{title}}</h1>
        <div class="tags">{{tags_html}}</div>
      </header>

      <div class="prose">
        {{content}}
      </div>

      <footer class="scroll-page-foot">
        <a href="../../#scripture-pavilion">← Back to the Scripture Pavilion</a>
      </footer>
    </article>

  </main>

  <div id="petals-front" class="petals petals--front" aria-hidden="true"></div>

</body>
</html>
