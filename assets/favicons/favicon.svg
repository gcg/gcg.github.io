<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonMonarch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#shieldGrad)" stroke="url(#neonCyan)" stroke-width="5" />

  <!-- Corner Tech Reticles (Monarch Purple) -->
  <path d="M 6 36 L 6 18 Q 6 6 18 6 L 36 6" fill="none" stroke="url(#neonMonarch)" stroke-width="6" stroke-linecap="round" />
  <path d="M 92 6 L 110 6 Q 122 6 122 18 L 122 36" fill="none" stroke="url(#neonMonarch)" stroke-width="6" stroke-linecap="round" />
  <path d="M 122 92 L 122 110 Q 122 122 110 122 L 92 122" fill="none" stroke="url(#neonMonarch)" stroke-width="6" stroke-linecap="round" />
  <path d="M 36 122 L 18 122 Q 6 122 6 110 L 6 92" fill="none" stroke="url(#neonMonarch)" stroke-width="6" stroke-linecap="round" />

  <!-- Inner Ambient Glow Line -->
  <rect x="14" y="14" width="100" height="100" rx="20" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" />

  <!-- gcg Insignia Typography -->
  <g id="gcg-text" filter="url(#glow)">
    <text x="64" y="78" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Impact', sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="-2px"
          text-anchor="middle" 
          fill="#ffffff">
      <tspan fill="#00e5ff">g</tspan><tspan fill="#ffffff">c</tspan><tspan fill="#00e5ff">g</tspan>
    </text>
  </g>

  <!-- Micro Power Indicator Pip -->
  <circle cx="64" cy="98" r="3.5" fill="#00e5ff" />
</svg>
